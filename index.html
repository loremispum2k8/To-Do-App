<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0">
    <title>To Do list</title>
<script defer src="main.js"></script></head>
<body>
        
    
    <div class="mainContainer">

        <div class="leftContainer">

            <div class="topFourGroups">
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="a58dcd0c3acbb18390e5.png" alt="icon">
                        <p class="fourTitle">Today</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="566b9ec137e9b48d9975.png" alt="icon">
                        <p class="fourTitle">Upcoming</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="be737a96356d9a5af0c5.png" alt="icon">
                        <p class="fourTitle">Expired</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="908a0840919fbc59fdf7.png" alt="icon">
                        <p class="fourTitle">High Priority</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
            </div>

            <div class="lowerLeftContainer">
                <div class="outer-div">
                    <div class="projectsTitleContainer">
                        <h1 class="bigProjectsTitle">Projects</h1>
                        <img class="projectDropDownArrow down" src="c51871bc6ef3021a81e3.png" alt="icon">
                    </div>
                </div>

                <div class="projectsList">
                </div>

                <div class="newProjectButton">
                    <img class="whitePlus" src="813cb6db9b2db844564f.png" alt="add icon">
                    <p class="newProjectButtonText">New Project</p>
                </div>
            </div>

        </div>
    </div>
    
    <div class="NewProjectPopUp">
        <div class="NewProjectContainer">
            <form name="projectName" class="NewProjectForm">
                <div class="newProjectTopRow">
                    <label for="project">Project Name</label>
                    <img class="projectCloseIcon" src="29f5b654a1cccef7b845.png" alt="close icon">
                </div>
                <input id="project" pattern="^(?!project$)(?!Project$)[a-zA-Z ]{1,25}$" name="project" type="text" placeholder="Max length: 25 characters" autocomplete="off" maxlength="25" required>
                <button class="projectBtn" type="submit">Done</button>
            </form>
        </div>
        <div class="NewProjectBlurredBg"></div>
    </div>

    <div class="NewListPopUp hidden">
        <div class="NewListContainer">
            <form name="ListName" class="NewListForm">
                <div class="newListTopRow">
                    <p class="listProject">Project: <span class="projectInput"></span></p>
                    <img class="listCloseIcon" src="29f5b654a1cccef7b845.png" alt="close icon">
                </div>
                <label for="listName">List Name</label>
                <input id="listName" name="listName" type="text" placeholder="Max length: 20 characters" autocomplete="off" maxlength="20" required>
                <label for="listDescription">List Description</label>
                <textarea id="listDescription" name="listDescription" type="text" placeholder="Max length: 100 characters" autocomplete="off" maxlength="100" required></textarea>
                <button class="listBtn" type="submit">Done</button>
            </form>
        </div>
        <div class="NewListBlurregBg"></div>
    </div>
</body>
</html>
