<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0">
    <title>Document</title>
<script defer src="main.js"></script></head>
<body>
        
    
    <div class="mainContainer">

        <div class="leftContainer">

            <div class="topFourGroups">
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="a58dcd0c3acbb18390e5.png" alt="icon">
                        <p class="fourTitle">Today</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="566b9ec137e9b48d9975.png" alt="icon">
                        <p class="fourTitle">Upcoming</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="be737a96356d9a5af0c5.png" alt="icon">
                        <p class="fourTitle">Expired</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
                <div class="groupContainer">
                    <div class="iconAndtitle">
                        <img class="fourIcon" src="908a0840919fbc59fdf7.png" alt="icon">
                        <p class="fourTitle">High Priority</p>
                    </div>
                    <p class="fourNumOfTasks">0</p>
                </div>
            </div>

            <div class="lowerLeftContainer">
                <div class="projectsTitleContainer">
                    <h1 class="bigProjectsTitle">Projects</h1>
                    <img class="projectDropDownArrow" src="c51871bc6ef3021a81e3.png" alt="icon">
                </div>

                <div class="projectsList">
                    <div class="projectContainer">
                        <div class="projectTopRow">
                            <h2 class="projectTitle">Default</h2>
                            <img class="projectPlus" src="813cb6db9b2db844564f.png" alt="plus">
                        </div>
                        <div class="projectAllLists">
                            <div class="listInline">
                                <h2 class="listTitle">Vacation in Rome</h2>
                                <h2 class="listNumber">0</h2>
                            </div>
                            <div class="listInline">
                                <h2 class="listTitle">Buy a new car</h2>
                                <h2 class="listNumber">0</h2>
                            </div>
                            <div class="listInline">
                                <h2 class="listTitle">Throw Party for John</h2>
                                <h2 class="listNumber">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="line"><p>text</p></div>
                    <div class="projectContainer lastProjectContainer">
                        <div class="projectTopRow">
                            <h2 class="projectTitle">Work</h2>
                            <img class="projectPlus" src="813cb6db9b2db844564f.png" alt="add icon">
                        </div>
                        <div class="projectAllLists">
                            <div class="listInline">
                                <h2 class="listTitle">Prepare Presentation</h2>
                                <h2 class="listNumber">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="newProjectButton">
                    <img class="whitePlus" src="813cb6db9b2db844564f.png" alt="add icon">
                    <p class="newProjectButtonText">New Project</p>
                </div>
            </div>

        </div>
    </div>
    
    <div class="NewProjectPopUp">
        <div class="NewProjectContainer">
            <form class="NewProjectForm">
                <div class="newProjectTopRow">
                    <label for="project">Project Name</label>
                    <img class="closeIcon" src="29f5b654a1cccef7b845.png" alt="close icon">
                </div>
                <input id="project" type="text" placeholder="Max lenght: 25 characters" maxlength="25" required autocomplete="off">
                <button class="projectBtn" type="submit">Done</button>
            </form>
        </div>
        <div class="NewProjectBlurredBg"></div>
    </div>
</body>
</html>
